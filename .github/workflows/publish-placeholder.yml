name: Publish placeholder image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push placeholder
        uses: docker/build-push-action@v6
        with:
          context: ./placeholder
          push: true
          tags: ghcr.io/pathtoresiliencebv/hyperswitch-railway-public:placeholder
