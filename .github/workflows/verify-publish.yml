name: Verify and publish Railway images

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - railway/**
      - .github/workflows/verify-publish.yml

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and JavaScript entrypoints
        run: |
          bash -n railway/router/start-router.sh
          bash -n railway/web/start-web.sh
          bash -n railway/control-center/start-control-center.sh
          bash -n railway/superposition-seed/seed_superposition.sh
          bash -n railway/postgres-backup/backup.sh
          bash -n railway/postgres-backup/restore-test.sh
          bash -n railway/router/prepare-context.sh
          node --check railway/control-center/secure-proxy.mjs

      - name: Scan repository contents for secrets
        run: |
          docker run --rm \
            -v "$PWD:/scan:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /scan --redact --verbose --exit-code 1

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - router
          - web
          - control-center
          - superposition
          - superposition-seed
          - postgres-backup
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch pinned router migrations
        if: matrix.service == 'router'
        run: railway/router/prepare-context.sh

      - name: Build and publish ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./railway/${{ matrix.service }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/pathtoresiliencebv/hyperswitch-railway-public:${{ matrix.service }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
